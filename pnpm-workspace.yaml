blockExoticSubdeps: true
dedupePeers: true
dedupePeerDependents: true
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@changesets/ghcommit@2.1.1"

overrides:
  # Keep upstream's tooling while excluding vulnerable transitive versions.
  "tinypool@<2.1.2": "2.1.2"
  "vite@>=8.0.0 <8.1.6": "8.1.6"
  lightningcss: "-" # we do not bundle any css
  postcss: "-" # we do not bundle any css

shellEmulator: true
trustPolicy: no-downgrade
